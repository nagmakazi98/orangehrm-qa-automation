# ===================== QA Environment Config =====================
env=qa
base.url=https://opensource-demo.orangehrmlive.com/
browser=chrome
headless=false
implicit.wait.seconds=10
explicit.wait.seconds=20
page.load.timeout.seconds=30

# Fallback credentials for public demo
login.username=Admin
login.password=admin123

# ESS user credentials
ess.username=linda.anderson
ess.password=admin123

# API Config
api.base.url=https://opensource-demo.orangehrmlive.com

# Test Data and File Paths
# Test data defaults (job titles, name pool, ID prefix) are owned by testdata.properties.
# testdata.employee.path is defined there; override via: -Dtestdata.employee.path=<path>
image.profile.path=src/test/resources/images/profile.png

# Reporting / Recording
screenshot.dir=test-output/screenshots
video.dir=reports/videos
extent.report.path=reports/ExtentReport.html
# Retry policy: max retries per flaky test (0 = disabled, max 3).
# AssertionError failures are never retried regardless of this value.
retry.count=1
