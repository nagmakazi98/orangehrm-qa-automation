# ===================== Application Config =====================
base.url=https://opensource-demo.orangehrmlive.com/
browser=chrome
headless=false
implicit.wait.seconds=10
explicit.wait.seconds=20
page.load.timeout.seconds=30

# Valid demo credentials (public OrangeHRM demo site)
login.username=Admin
login.password=admin123

# ===================== API Config =====================
# The public OrangeHRM demo instance does not expose an open REST API for
# employee CRUD, so this framework simulates/cross-checks the API layer
# against ReqRes (https://reqres.in) as instructed in the assessment.
# Swap api.base.url for the real OrangeHRM API host if you have credentials
# for one (e.g. an internal OrangeHRM instance with API access enabled).
api.base.url=https://reqres.in/api

# ===================== Reporting / Recording =====================
screenshot.dir=test-output/screenshots
video.dir=reports/videos
extent.report.path=reports/ExtentReport.html
