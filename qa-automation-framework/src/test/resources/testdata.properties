# ===================== Test Data Configuration =====================
# This file owns ONLY test data defaults and generation parameters.
# - Framework config (timeouts, browser, headless)  -> config.properties / config-<env>.properties
# - Credentials (login.username, ess.password, etc.) -> config.properties / env vars / CI secrets
# - Generated runtime data (names, IDs)              -> DataFactory (never stored here)

# ---------------------------------------------------------------------------
# Employee job title to use when testing the "Edit Employee" scenario.
# Must match an existing Job Title in the OrangeHRM instance exactly.
# Override via: -Dtestdata.employee.updatedJobTitle=<value>
# ---------------------------------------------------------------------------
testdata.employee.updatedJobTitle=Software Engineer

# ---------------------------------------------------------------------------
# Employment status to use when testing the "Edit Employee" scenario.
# Must match an existing Employment Status in the OrangeHRM instance exactly.
# Override via: -Dtestdata.employee.updatedEmploymentStatus=<value>
# ---------------------------------------------------------------------------
testdata.employee.updatedEmploymentStatus=Full-Time Permanent

# ---------------------------------------------------------------------------
# First-name pool used by DataFactory to generate diverse employee names.
# Comma-separated. DataFactory picks one at random per invocation.
# Keeps report output readable while still guaranteeing uniqueness via suffix.
# Override via: -Dtestdata.firstname.pool=<value>
# ---------------------------------------------------------------------------
testdata.firstname.pool=Alex,Jordan,Morgan,Taylor,Casey,Riley,Quinn,Avery,Blake,Drew

# ---------------------------------------------------------------------------
# Employee ID prefix.  Full ID = <prefix><8-digit-unique-suffix>
# Must be short enough that prefix + 8 digits <= OrangeHRM's 9-char field limit.
# Override via: -Dtestdata.employeeid.prefix=A
# ---------------------------------------------------------------------------
testdata.employeeid.prefix=A

# ---------------------------------------------------------------------------
# Path to the baseline employee JSON template (relative to classpath).
# DataFactory.fromJson() reads this, then overwrites firstName/lastName/employeeId
# with runtime-unique values before returning the object.
# ---------------------------------------------------------------------------
testdata.employee.path=testdata/employee.json
